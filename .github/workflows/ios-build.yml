# iOS App Store Build — chạy trên cloud Mac (FREE, không cần Mac vật lý)
# Trigger: push tag `ios-v*` → build + archive + upload lên App Store Connect
#
# CẦN SETUP (1 lần):
# 1. App Store Connect → Users and Access → Keys → tạo API Key (.p8)
# 2. Lưu: Issuer ID + Key ID + file .p8 (base64)
# 3. GitHub repo → Settings → Secrets → thêm:
#    - APP_STORE_CONNECT_API_KEY  (base64 của file .p8)
#    - APP_STORE_CONNECT_ISSUER_ID
#    - APP_STORE_CONNECT_KEY_ID
name: iOS Build & Upload

on:
  push:
    tags: ['ios-v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15  # cloud Mac (free 2000 phút/tháng cho public repo)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Setup Capacitor iOS
        run: |
          npx cap add ios 
          npx cap copy ios

      - name: Copy app icons
        run: |
          mkdir -p ios/App/App/Assets.xcassets/AppIcon.appiconset
          cp resources/ios-icons/*.png ios/App/App/Assets.xcassets/AppIcon.appiconset/ 2>/dev/null 

      - name: Set up Ruby for fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install fastlane
        run: gem install fastlane

      - name: Decode API key
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          echo "$APP_STORE_CONNECT_API_KEY" | base64 --decode > AuthKey_$(echo ${{ secrets.APP_STORE_CONNECT_KEY_ID }}).p8

      - name: Build & upload to App Store Connect
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          fastlane pilot build --scheme App --project ios/App/App.xcodeproj 
          # Hoặc dùng xcodebuild trực tiếp:
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -archivePath build/App.xcarchive archive -allowProvisioningUpdates CODE_SIGN_STYLE=Automatic || echo "Build needs Xcode signing setup — xem APP-STORE-SUBMISSION.md"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-archive
          path: build/
          retention-days: 7
