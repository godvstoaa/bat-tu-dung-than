# iOS App Store Build — chạy trên cloud Mac (macOS runner)
# Trigger: push tag `ios-v*` hoặc workflow_dispatch.
#
# [AUDIT FIX] Workflow cũ "xanh lá giả": `fastlane pilot build` không có Fastfile luôn fail
# nhưng bị `|| true` nuốt → không bao giờ build/upload thật. Giờ workflow trung thực:
#   - Build Release KHÔNG sign (CODE_SIGNING_ALLOWED=NO) → zip + upload artifact.
#   - Upload lên App Store Connect cần code-signing certs (Fastlane match / Xcode signing)
#     + tài khoản trả phí — không thể tự động hóa trong repo này; làm thủ công theo
#     APP-STORE-SUBMISSION.md.
name: iOS Build

on:
  push:
    tags: ['ios-v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Setup Capacitor iOS
        run: |
          npx cap add ios
          npx cap copy ios

      - name: Apply app icons (Contents.json sinh từ tên file chuẩn)
        run: |
          set -e
          mkdir -p ios/App/App/Assets.xcassets/AppIcon.appiconset
          cp resources/ios-icons/icon-AppStore-1024.png resources/ios-icons/icon-iPad-152@2x.png resources/ios-icons/icon-iPad-167@3x.png resources/ios-icons/icon-iPhone-120@2x.png resources/ios-icons/icon-iPhone-180@3x.png resources/ios-icons/icon-Notification-20@2x.png resources/ios-icons/icon-Notification-60@3x.png resources/ios-icons/icon-Settings-29@2x.png resources/ios-icons/icon-Settings-58@2x.png resources/ios-icons/icon-Settings-87@3x.png resources/ios-icons/icon-Spotlight-40@2x.png resources/ios-icons/icon-Spotlight-80@2x.png ios/App/App/Assets.xcassets/AppIcon.appiconset/
          node -e "
            const fs = require('fs');
            const dir = 'ios/App/App/Assets.xcassets/AppIcon.appiconset';
            const sizeOf = { 'icon-Notification-20@2x.png': ['20x20','2x'], 'icon-Notification-60@3x.png': ['60x60','3x'],
              'icon-iPhone-120@2x.png': ['120x120','2x'], 'icon-iPhone-180@3x.png': ['180x180','3x'],
              'icon-iPad-152@2x.png': ['152x152','2x'], 'icon-iPad-167@3x.png': ['167x167','3x'],
              'icon-Settings-29@2x.png': ['29x29','2x'], 'icon-Settings-58@2x.png': ['58x58','2x'], 'icon-Settings-87@3x.png': ['87x87','3x'],
              'icon-Spotlight-40@2x.png': ['40x40','2x'], 'icon-Spotlight-80@2x.png': ['80x80','2x'],
              'icon-AppStore-1024.png': ['1024x1024','1x'] };
            const images = fs.readdirSync(dir).filter(f => f.endsWith('.png')).map(f => {
              const [sz, scale] = sizeOf[f] || [null, null];
              return { filename: f, idiom: f.includes('iPad') ? 'ipad' : (f.includes('AppStore') ? 'ios-marketing' : 'iphone'), size: sz, scale };
            }).filter(i => i.size);
            fs.writeFileSync(dir + '/Contents.json', JSON.stringify({ images, info: { version: 1, author: 'xcode' } }, null, 2));
            console.log('Contents.json:', images.length, 'images');
          "

      - name: Build app (Release, không sign)
        run: |
          set -e
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            build
          mkdir -p build/export
          cp -R build/DerivedData/Build/Products/Release-iphoneos/App.app build/export/

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-app
          path: build/export/
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          echo "## iOS Build" >> $GITHUB_STEP_SUMMARY
          echo "Build hoàn tất (không sign). Upload App Store Connect cần signing certs — xem APP-STORE-SUBMISSION.md" >> $GITHUB_STEP_SUMMARY
