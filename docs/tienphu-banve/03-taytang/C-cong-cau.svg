<svg xmlns='http://www.w3.org/2000/svg' width='1160' height='400' viewBox='0 0 1160 400' font-family='Segoe UI, Arial, sans-serif'><rect width='1160' height='400' fill='#f7f2e6'/><text x='30' y='40' font-size='20' fill='#2b241c' font-weight='bold'>CỔNG &amp; CẦU — Cung Điện Tây Tạng</text><text x='30' y='62' font-size='13' fill='#2b241c' >Bản vẽ 03-C · cổng chính kiểu «tibet» rộng 10 m giữa mặt Nam (nối cầu ngọc)</text><text x='30' y='100' font-size='12' fill='#2b241c' >• Cổng chính — khe 10 m tại (0, 260) · tường cao 7 m</text><text x='30' y='118' font-size='12' fill='#2b241c' >• Cổng Đông — khe 7 m tại (260, 210) · tường cao 7 m</text><text x='30' y='136' font-size='12' fill='#2b241c' >• Cổng Tây — khe 7 m tại (-260, 210) · tường cao 7 m</text><text x='30' y='154' font-size='12' fill='#2b241c' >• Cổng Bắc — khe 7 m tại (-120, -260) · tường cao 7 m</text><text x='30' y='194' font-size='13' fill='#2b241c' font-weight='bold'>Cầu 1 — dài 26 m, rộng 4 m, vồng 1,6 m · tâm (60, -232)</text><rect x='60' y='234' width='341.3' height='29' fill='#d9b98c' stroke='#2b241c'/><polyline points='580,282 597.1,278.7 614.1,275.5 631.2,272.5 648.3,269.7 665.3,267.2 682.4,265 699.4,263.3 716.5,262 733.6,261.3 750.6,261 767.7,261.3 784.8,262 801.8,263.3 818.9,265 835.9,267.2 853,269.7 870.1,272.5 887.1,275.5 904.2,278.7 921.3,282' fill='none' stroke='#2b241c' stroke-width='3'/><line x1='560' y1='282' x2='941.3' y2='282' stroke='#4b7f9f' stroke-width='2'/><text x='60' y='292' font-size='11' fill='#2b241c' >mặt bằng</text><text x='580' y='302' font-size='11' fill='#2b241c' >mặt đứng (đường mặt cầu, nước xanh)</text></svg>