<svg xmlns='http://www.w3.org/2000/svg' width='1160' height='400' viewBox='0 0 1160 400' font-family='Segoe UI, Arial, sans-serif'><rect width='1160' height='400' fill='#f7f2e6'/><text x='30' y='40' font-size='20' fill='#2b241c' font-weight='bold'>CỔNG &amp; CẦU — Art Deco</text><text x='30' y='62' font-size='13' fill='#2b241c' >Bản vẽ 05-C · cổng chính kiểu «deco» rộng 10 m giữa mặt Nam (nối cầu ngọc)</text><text x='30' y='100' font-size='12' fill='#2b241c' >• Cổng chính — khe 10 m tại (0, 260) · tường cao 6 m</text><text x='30' y='118' font-size='12' fill='#2b241c' >• Cổng Đông — khe 7 m tại (260, 200) · tường cao 6 m</text><text x='30' y='136' font-size='12' fill='#2b241c' >• Cổng Bắc — khe 7 m tại (-60, -260) · tường cao 6 m</text><text x='30' y='176' font-size='13' fill='#2b241c' font-weight='bold'>Cầu 1 — dài 26 m, rộng 4,5 m, vồng 0,6 m (cầu phẳng) · tâm (-60, 30)</text><rect x='60' y='216' width='341.3' height='31.6' fill='#d9b98c' stroke='#2b241c'/><polyline points='580,256.1 597.1,256.1 614.1,256.1 631.2,256.1 648.3,256.1 665.3,256.1 682.4,256.1 699.4,256.1 716.5,256.1 733.6,256.1 750.6,256.1 767.7,256.1 784.8,256.1 801.8,256.1 818.9,256.1 835.9,256.1 853,256.1 870.1,256.1 887.1,256.1 904.2,256.1 921.3,256.1' fill='none' stroke='#2b241c' stroke-width='3'/><line x1='560' y1='264' x2='941.3' y2='264' stroke='#4b7f9f' stroke-width='2'/><text x='60' y='274' font-size='11' fill='#2b241c' >mặt bằng</text><text x='580' y='284' font-size='11' fill='#2b241c' >mặt đứng (đường mặt cầu, nước xanh)</text></svg>