<svg xmlns='http://www.w3.org/2000/svg' width='1160' height='400' viewBox='0 0 1160 400' font-family='Segoe UI, Arial, sans-serif'><rect width='1160' height='400' fill='#f7f2e6'/><text x='30' y='40' font-size='20' fill='#2b241c' font-weight='bold'>CỔNG &amp; CẦU — Cung Đình Trung Hoa</text><text x='30' y='62' font-size='13' fill='#2b241c' >Bản vẽ 01-C · cổng chính kiểu «paifang» rộng 10 m giữa mặt Nam (nối cầu ngọc)</text><text x='30' y='100' font-size='12' fill='#2b241c' >• Cổng chính — khe 10 m tại (0, 260) · tường cao 8 m</text><text x='30' y='118' font-size='12' fill='#2b241c' >• Cổng Đông — khe 7 m tại (260, 60) · tường cao 8 m</text><text x='30' y='136' font-size='12' fill='#2b241c' >• Cổng Tây — khe 7 m tại (-260, 60) · tường cao 8 m</text><text x='30' y='154' font-size='12' fill='#2b241c' >• Cổng Bắc — khe 7 m tại (0, -260) · tường cao 8 m</text><text x='30' y='194' font-size='13' fill='#2b241c' font-weight='bold'>Cầu 1 — dài 76 m, rộng 4,5 m, vồng 1,8 m · tâm (0, -150)</text><rect x='60' y='234' width='389.3' height='17.2' fill='#d9b98c' stroke='#2b241c'/><polyline points='580,282 599.5,280.6 618.9,279.2 638.4,277.8 657.9,276.6 677.3,275.5 696.8,274.5 716.2,273.8 735.7,273.2 755.2,272.9 774.6,272.8 794.1,272.9 813.6,273.2 833,273.8 852.5,274.5 872,275.5 891.4,276.6 910.9,277.8 930.3,279.2 949.8,280.6 969.3,282' fill='none' stroke='#2b241c' stroke-width='3'/><line x1='560' y1='282' x2='989.3' y2='282' stroke='#4b7f9f' stroke-width='2'/><text x='60' y='292' font-size='11' fill='#2b241c' >mặt bằng</text><text x='580' y='302' font-size='11' fill='#2b241c' >mặt đứng (đường mặt cầu, nước xanh)</text></svg>